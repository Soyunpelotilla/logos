name: Descargar logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar imagenes
        run: |
          mkdir -p logos
          mkdir -p agenda
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            carpeta=$(echo "$line" | cut -d'|' -f1)
            url=$(echo "$line" | cut -d'|' -f2)
            nombre=$(basename "$url")
            echo "Descargando $nombre en $carpeta"
            curl -sL --fail "$url" -o "$carpeta/$nombre" || echo "FALLO: $url"
          done < urls.txt

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logos agenda
          git commit -m "Descargar logos" || echo "Nada que commitear"
          git pull --rebase origin main
          git push

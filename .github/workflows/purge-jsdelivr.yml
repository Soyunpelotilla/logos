name: Purge jsDelivr cache

on:
  push:
    branches: [main]
    paths:
      - 'logos/**'

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar logos cambiados
        id: changes
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only HEAD^ HEAD -- 'logos/*' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Purgar en jsDelivr
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$file"
            echo "Purgando: $url"
            curl -s "$url" > /dev/null
          done <<< "${{ steps.changes.outputs.files }}"

      - name: Actualizar version.json
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'logos/*' | jq -R . | jq -s .)
          echo "{\"v\":\"$(date +%s)\",\"changed\":$CHANGED}" > version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "Actualizar version" || echo "Nada que commitear"
          git push

name: Purge jsDelivr cache

on:
  push:
    branches: [main]
    paths:
      - 'logos/**'
      - 'agenda/**'

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Purgar en jsDelivr y actualizar version.json
        run: |
          # Obtenemos los archivos modificados en logos/ y agenda/
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- logos/ agenda/)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No hay archivos relevantes para purgar."
            exit 0
          fi

          # 1. Purgar en jsDelivr en paralelo
          echo "$CHANGED_FILES" | xargs -I {} -P 5 curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/{}" > /dev/null

          # 2. Generar el nuevo version.json
          JSON_CHANGED=$(echo "$CHANGED_FILES" | jq -R . | jq -s .)
          echo "{\"v\":\"$(date +%s)\",\"changed\":$JSON_CHANGED}" > version.json

      - name: Commit y Push de version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          
          if git commit -m "chore: actualizar version.json [skip ci]"; then
            git pull --rebase origin main
            git push
          fi
